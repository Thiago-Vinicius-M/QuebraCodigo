# === PostgreSQL ===
# Schema "app": evita erro de permissao no "public" (PostgreSQL 15+). Criar uma vez com postgres-setup.sql
# Pooler Session (IPv4) — conexão direta db.*.supabase.co exige IPv6 e falha em redes só IPv4
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?currentSchema=app&sslmode=require&loginTimeout=30
spring.datasource.username=postgres.prjsaxxfmlstczvhjnxc
spring.datasource.password=quebracodigo2026
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# === Flyway (migrations no schema app; dono = qc_user apos script postgres-setup.sql) ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=app

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=app
# Ajuda a ver no log se o DDL falhou (ex.: sem permissao CREATE no schema)
logging.level.org.hibernate.tool.schema=INFO

logging.level.org.springframework.boot.autoconfigure=DEBUG

# Porta
server.port=8150
app.base-url=http://localhost:8150

# === E-mail (recuperacao de senha) ===
# Configure com seu provedor SMTP para envio real
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=SEU_EMAIL_AQUI
spring.mail.password=SUA_SENHA_DE_APP_AQUI
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# === Configuracao de recursos estaticos ===
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
# Cache longo no browser (ícones/CSS/JS) — evita baixar de novo a cada visita
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.cache=true

# Compressao HTTP para texto (HTML/CSS/JS/SVG)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
