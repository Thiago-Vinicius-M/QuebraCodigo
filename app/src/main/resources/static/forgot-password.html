<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha — Quebra Código</title>
    <link rel="icon" type="image/png" href="img/home/logoQuebraCodigo.png">
    <link rel="shortcut icon" type="image/png" href="img/home/logoQuebraCodigo.png">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/animate.css">
</head>
<body>

<main class="container page-in">

    <header>
        <img class="logo" src="img/login/LogoQuebraCodigo.png" alt="Logo do sistema">
    </header>

    <section class="welcome-area">
        <h1 class="welcome-title fade-in">Recuperar acesso</h1>
        <p class="welcome-quote fade-in delay-1" style="font-style: normal; max-width: 28rem;">
            Informe o <strong>e-mail cadastrado</strong> na sua conta. Enviaremos um link para você criar uma nova senha com segurança.
        </p>
    </section>

    <section class="form-area glass-rise" aria-labelledby="forgot-title">
        <h2 id="forgot-title" class="visually-hidden">Recuperação de senha</h2>

        <form class="login-form" id="forgot-form" novalidate>
            <label class="input-box stagger delay-1">
                <img class="input-icon" src="img/login/user.png" alt="">
                <input type="email" name="email" id="email-recuperacao" autocomplete="email"
                       placeholder="Seu e-mail cadastrado" required maxlength="120">
            </label>

            <p id="forgot-msg" class="fade-in delay-2" style="margin-top: 0.75rem; font-size: 0.9rem; min-height: 1.25em;" role="status" aria-live="polite"></p>

            <div class="login-actions fade-in delay-3">
                <button type="button" class="create-btn" id="btn-voltar-login">Voltar ao login</button>
                <button type="submit" class="login-btn" id="btn-enviar">Enviar link</button>
            </div>
        </form>
    </section>

</main>

<script src="js/qc-static-base.js"></script>
<script>
    function animateAndGo(url) {
        const container = document.querySelector(".container");
        container.classList.remove("page-in");
        container.classList.add("page-out");
        container.addEventListener("animationend", () => {
            window.location.href = url;
        }, { once: true });
    }

    const form = document.getElementById("forgot-form");
    const msg = document.getElementById("forgot-msg");
    const emailInput = document.getElementById("email-recuperacao");

    document.getElementById("btn-voltar-login").addEventListener("click", function (e) {
        e.preventDefault();
        animateAndGo("login.html");
    });

    form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = emailInput.value.trim();
        msg.style.color = "#e74c3c";
        msg.textContent = "";

        if (!email) {
            msg.textContent = "Informe o e-mail cadastrado.";
            emailInput.focus();
            return;
        }

        try {
            const res = await fetch(qcAuthUrl("/auth/forgot-password"), qcAuthFetchInit({
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            }));
            const data = await res.json();
            if (res.ok) {
                msg.style.color = "#2ecc71";
                msg.textContent = data.message || "Se o e-mail estiver cadastrado, você receberá as instruções.";
            } else {
                msg.textContent = data.error || "Não foi possível enviar o e-mail. Tente novamente.";
            }
        } catch (_) {
            msg.textContent = window.QC_API_BASE
                ? "Não foi possível contatar localhost:8150. Inicie o Spring Boot."
                : "Erro de conexão. Verifique sua rede e tente de novo.";
        }
    });
</script>
</body>
</html>
