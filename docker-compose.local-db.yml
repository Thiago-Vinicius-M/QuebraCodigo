# Override opcional: sobe Postgres local em vez do Supabase.
# Uso: docker compose -f docker-compose.yml -f docker-compose.local-db.yml up --build
#
# Com Postgres local, a app NÃO usa network_mode:host (precisa falar com o serviço db).

services:
  db:
    image: postgres:16-alpine
    container_name: quebracodigo-db
    environment:
      POSTGRES_DB: quebra_codigo
      POSTGRES_USER: qc_user
      POSTGRES_PASSWORD: qc_pass
    ports:
      - "5432:5432"
    volumes:
      - qc_postgres_data:/var/lib/postgresql/data
      - ./app/scripts/docker-init.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_user -d quebra_codigo"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    network_mode: bridge
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8150:8150"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/quebra_codigo?currentSchema=app
      SPRING_DATASOURCE_USERNAME: qc_user
      SPRING_DATASOURCE_PASSWORD: qc_pass

volumes:
  qc_postgres_data:
