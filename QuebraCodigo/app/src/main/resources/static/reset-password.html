<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha</title>
    <link rel="icon" type="image/png" href="img/home/logoQuebraCodigo.png">
    <link rel="shortcut icon" type="image/png" href="img/home/logoQuebraCodigo.png">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="container page-in" style="max-width: 520px;">
    <section class="form-area glass-rise">
        <h1 style="margin-bottom: 1rem;">Criar nova senha</h1>
        <form id="reset-form">
            <label class="input-box">
                <img class="input-icon" src="img/login/padlock.png" alt="">
                <input type="password" id="nova-senha" placeholder="Nova senha" minlength="4" required>
            </label>
            <label class="input-box" style="margin-top: .7rem;">
                <img class="input-icon" src="img/login/padlock.png" alt="">
                <input type="password" id="confirmar-senha" placeholder="Confirmar nova senha" minlength="4" required>
            </label>
            <div class="login-actions" style="margin-top: 1rem;">
                <button type="submit" class="login-btn">Salvar nova senha</button>
            </div>
            <p id="reset-msg" style="margin-top:.7rem;"></p>
        </form>
    </section>
</main>

<script src="js/qc-static-base.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const form = document.getElementById("reset-form");
    const msg = document.getElementById("reset-msg");

    if (!token) {
        msg.style.color = "#e74c3c";
        msg.textContent = "Link inválido. Solicite uma nova recuperação de senha.";
        form.querySelector("button[type='submit']").disabled = true;
    }

    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        const senha = document.getElementById("nova-senha").value;
        const confirmar = document.getElementById("confirmar-senha").value;

        msg.style.color = "#e74c3c";
        if (senha.length < 4) {
            msg.textContent = "A senha deve ter pelo menos 4 caracteres.";
            return;
        }
        if (senha !== confirmar) {
            msg.textContent = "As senhas não conferem.";
            return;
        }

        try {
            const res = await fetch(qcAuthUrl("/auth/reset-password"), qcAuthFetchInit({
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, novaSenha: senha })
            }));
            const data = await res.json();
            if (!res.ok) {
                msg.textContent = data.error || "Não foi possível redefinir a senha.";
                return;
            }

            msg.style.color = "#2ecc71";
            msg.textContent = "Senha atualizada com sucesso. Redirecionando para o login...";
            setTimeout(() => {
                window.location.href = window.QC_API_BASE
                    ? (window.QC_API_BASE + "/login.html")
                    : "/login.html";
            }, 1800);
        } catch (_) {
            msg.textContent = window.QC_API_BASE
                ? "Não foi possível contatar localhost:8150. Inicie o Spring Boot."
                : "Erro de conexão. Tente novamente.";
        }
    });
</script>
</body>
</html>
