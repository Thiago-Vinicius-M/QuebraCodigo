<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="icon" type="image/png" href="img/home/logoQuebraCodigo.png">
    <link rel="shortcut icon" type="image/png" href="img/home/logoQuebraCodigo.png">
    <link rel="stylesheet" href="css/cadastro.css"/>
    <link rel="stylesheet" href="css/animate.css">
</head>
<body>
<main class="page-container">

    <header class="form-header">
        <a href="login.html" class="go-back slide-left delay-2" id="go-back" aria-label="Voltar">
            <img src="img/games/sidebar-topbar/setaVoltar.png" alt="Botão retornar para a Home">
        </a>
        <h1 class="form-title zoom-blur delay-2">Faça seu cadastro</h1>
    </header>

    <form class="register-form glass-rise delay-3">

        <div class="name-group">
            <div class="input-wrapper slide-left delay-3">
                <input type="text" id="first-name" name="primeiroNome" placeholder="Primeiro nome" />
            </div>

            <div class="input-wrapper slide-left delay-3">
                <input type="text" id="last-name" name="ultimoNome" placeholder="Último nome" />
            </div>
        </div>

        <div class="input-wrapper icon-left slide-left delay-3">
            <span class="icon">📅</span>
            <input type="text" id="data-nascimento" name="dataNascimento" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="dd/mm/aaaa" spellcheck="false" data-lpignore="true" />
        </div>

        <div class="input-wrapper icon-left slide-left delay-3">
            <span class="icon">✉️</span>
            <input type="email" id="email" name="email" placeholder="Email@exemplo.com" />
        </div>

        <div class="input-wrapper icon-left slide-left delay-3">
            <span class="icon">👤</span>
            <input type="text" id="usuario" name="usuario" placeholder="Usuário" required minlength="2" />
        </div>

        <div class="input-wrapper icon-left slide-left delay-3">
            <span class="icon">🔒</span>
            <input type="password" id="senha" name="senha" placeholder="Senha" required minlength="4" />
        </div>

        <div class="social-section fade-in delay-7">
            <p>Continuar com</p>

            <div class="social-icons zoom-blur delay-8">
                <img src="img/login/Google Logo 1.png" alt="Google" />
            </div>

            <button type="submit" class="submit-button zoom-blur delay-9" id="criarConta-button">
                Criar conta
            </button>
        </div>

    </form>
    <script>
        function qcDaysInMonth(month, year) {
            if (month < 1 || month > 12) return 31;
            return new Date(year, month, 0).getDate();
        }

        /** Normaliza 8 dígitos ddmmaaaa: impossíveis viram o máximo válido naquele contexto. */
        function qcSanitizeBirthDigits(raw) {
            let d = raw.replace(/\D/g, "").slice(0, 8);
            if (d.length === 0) return d;
            const a = d.split("");

            if (a.length >= 1 && a[0] > "3") a[0] = "3";
            if (a.length >= 2) {
                let dd = parseInt(a[0] + a[1], 10);
                if (dd < 1) {
                    a[0] = "0";
                    a[1] = "1";
                }
                if (dd > 31) {
                    a[0] = "3";
                    a[1] = "1";
                }
                if (a[0] === "3" && a[1] > "1") a[1] = "1";
            }

            if (a.length >= 3 && a[2] > "1") a[2] = "0";
            if (a.length >= 4) {
                let mm = parseInt(a[2] + a[3], 10);
                if (mm < 1) {
                    a[2] = "0";
                    a[3] = "1";
                }
                if (mm > 12) {
                    a[2] = "1";
                    a[3] = "2";
                }
                if (a[2] === "0" && a[3] === "0") a[3] = "1";
                if (a[2] === "1" && a[3] > "2") a[3] = "2";
            }

            if (a.length >= 4) {
                let dd = parseInt(a[0] + a[1], 10);
                const mm = parseInt(a[2] + a[3], 10);
                let maxD = 31;
                if (mm === 2) maxD = 29;
                else if (mm === 4 || mm === 6 || mm === 9 || mm === 11) maxD = 30;
                if (dd > maxD) {
                    const s = String(maxD).padStart(2, "0");
                    a[0] = s[0];
                    a[1] = s[1];
                }
            }

            if (a.length >= 8) {
                let yyyy = parseInt(a.slice(4, 8).join(""), 10);
                const maxY = new Date().getFullYear();
                const minY = Math.max(1900, maxY - 120);
                if (yyyy > maxY) yyyy = maxY;
                if (yyyy < minY) yyyy = minY;
                const ys = String(yyyy).padStart(4, "0");
                for (let i = 0; i < 4; i++) a[4 + i] = ys[i];

                const mm = parseInt(a[2] + a[3], 10);
                let dd = parseInt(a[0] + a[1], 10);
                const dim = qcDaysInMonth(mm, yyyy);
                if (dd > dim) {
                    const s = String(dim).padStart(2, "0");
                    a[0] = s[0];
                    a[1] = s[1];
                }
                if (dd < 1) {
                    a[0] = "0";
                    a[1] = "1";
                }
            }

            return a.join("");
        }

        function qcFormatBRDateDigits(digits) {
            if (digits.length <= 2) return digits;
            if (digits.length <= 4) return digits.slice(0, 2) + "/" + digits.slice(2);
            return digits.slice(0, 2) + "/" + digits.slice(2, 4) + "/" + digits.slice(4);
        }

        function qcIsValidBirthDateStr(str) {
            const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str.trim());
            if (!m) return false;
            const dd = parseInt(m[1], 10);
            const mm = parseInt(m[2], 10);
            const yyyy = parseInt(m[3], 10);
            const maxY = new Date().getFullYear();
            const minY = Math.max(1900, maxY - 120);
            if (yyyy < minY || yyyy > maxY) return false;
            if (mm < 1 || mm > 12) return false;
            const dim = qcDaysInMonth(mm, yyyy);
            if (dd < 1 || dd > dim) return false;
            return true;
        }

        (function () {
            const dataInput = document.getElementById("data-nascimento");
            if (!dataInput) return;
            dataInput.addEventListener("input", function () {
                const start = this.selectionStart;
                const before = this.value;
                const countDigitsLeftOfCursor = before.slice(0, start).replace(/\D/g, "").length;
                const digits = qcSanitizeBirthDigits(before);
                const formatted = qcFormatBRDateDigits(digits);
                this.value = formatted;
                let pos = formatted.length;
                if (countDigitsLeftOfCursor > 0) {
                    let seen = 0;
                    for (let i = 0; i < formatted.length; i++) {
                        if (/\d/.test(formatted[i])) {
                            seen++;
                            if (seen === countDigitsLeftOfCursor) {
                                pos = i + 1;
                                break;
                            }
                        }
                    }
                }
                this.setSelectionRange(pos, pos);
            });
            dataInput.addEventListener("blur", function () {
                const d = this.value.replace(/\D/g, "");
                if (d.length === 8) {
                    const fixed = qcSanitizeBirthDigits(d);
                    this.value = qcFormatBRDateDigits(fixed);
                } else if (d.length > 0 && d.length < 8) {
                    this.value = qcFormatBRDateDigits(d);
                }
            });
        })();
    </script>
    <script src="js/qc-static-base.js"></script>
    <script>
        document.getElementById("go-back").addEventListener("click", function(e) {
            e.preventDefault();
            window.location.href = "login.html";
        });

        document.querySelector(".register-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            if (window.location.protocol === "file:") {
                alert("O cadastro só funciona com o servidor rodando. Inicie o Spring Boot e abra:\nhttp://localhost:8150/cadastro.html");
                return;
            }
            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value;
            const email = document.getElementById("email").value.trim();
            const primeiroNome = document.getElementById("first-name").value.trim();
            const ultimoNome = document.getElementById("last-name").value.trim();
            const dataNascimento = document.getElementById("data-nascimento").value.trim();

            if (!primeiroNome || !ultimoNome) {
                alert("Preencha nome e sobrenome.");
                return;
            }
            if (!email) {
                alert("Preencha o e-mail.");
                return;
            }
            if (!dataNascimento) {
                alert("Preencha a data de nascimento (dd/mm/aaaa).");
                return;
            }
            if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dataNascimento)) {
                alert("Use a data completa no formato dd/mm/aaaa (ex.: 17/09/1999).");
                return;
            }
            if (!qcIsValidBirthDateStr(dataNascimento)) {
                alert("Data de nascimento inválida. Confira dia, mês e ano (idade máxima 120 anos).");
                return;
            }
            if (!usuario || usuario.length < 2) {
                alert("O usuário deve ter pelo menos 2 caracteres.");
                return;
            }
            if (!senha || senha.length < 4) {
                alert("A senha deve ter pelo menos 4 caracteres.");
                return;
            }

            const msgEl = document.getElementById("cadastro-msg");
            if (msgEl) msgEl.remove();

            try {
                const res = await fetch(qcAuthUrl("/auth/register"), qcAuthFetchInit({
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        primeiroNome,
                        ultimoNome,
                        email,
                        dataNascimento,
                        usuario,
                        senha
                    })
                }));
                const data = await res.json();

                if (res.ok) {
                    window.location.href = window.QC_API_BASE
                        ? (window.QC_API_BASE + "/index.html")
                        : "index.html";
                } else {
                    const p = document.createElement("p");
                    p.id = "cadastro-msg";
                    p.style.color = "#e74c3c";
                    p.style.marginTop = "0.5rem";
                    const msg = data.error || data.message || data.detail || "Erro ao criar conta.";
                    p.textContent = typeof msg === "string" ? msg : JSON.stringify(msg);
                    document.querySelector(".submit-button").before(p);
                }
            } catch (err) {
                const p = document.createElement("p");
                p.id = "cadastro-msg";
                p.style.color = "#e74c3c";
                p.textContent = window.QC_API_BASE
                    ? ("Não foi possível falar com o servidor em " + window.QC_API_BASE + ". Deixe o Spring Boot rodando na porta 8150 e tente de novo.")
                    : "Erro de conexão. Tente novamente.";
                document.querySelector(".submit-button").before(p);
            }
        });
    </script>
</main>
</body>
</html>
