<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - Quebra Código</title>
    <link rel="icon" type="image/png" href="../img/home/logoQuebraCodigo.png">
    <link rel="shortcut icon" type="image/png" href="../img/home/logoQuebraCodigo.png">
    <link rel="stylesheet" href="../css/course.css">
    <script>
        // Aplica o tema/preferências salvos na home antes do render para evitar "flash"
        (function () {
            try {
                const raw = localStorage.getItem("qc:settings:v1");
                if (!raw) return;
                const s = JSON.parse(raw);
                const cls = document.documentElement.classList;
                if (s.theme === "contrast") cls.add("theme-contrast");
                if (s.glass === false) cls.add("glass-off");
                if (s.animations === false) cls.add("animations-off");
                if (s.zoom && Number(s.zoom) !== 100) {
                    document.documentElement.style.zoom = (Number(s.zoom) / 100).toString();
                }
            } catch (_) {}
        })();
    </script>
</head>
<body>
<div class="course-page">
    <!-- Sidebar estilo W3Schools: navegação do curso -->
    <aside class="course-sidebar">
        <div class="course-logo" id="course-logo"><span>Curso</span></div>
        <h2 class="course-nav-title" id="course-nav-title">Conteúdo</h2>
        <nav class="course-nav-wrap">
            <ul class="course-nav" id="course-nav"></ul>
        </nav>
        <a href="../index.html" class="course-btn-home">← Home</a>
    </aside>

    <!-- Área principal -->
    <main class="course-main">
        <div id="course-loading" class="course-loading">Carregando curso...</div>
        <div id="course-error" class="course-error" style="display:none;"></div>

        <div id="course-content" class="course-content-wrap" style="display:none;">
            <article class="course-article">
                <div id="lesson-area" class="lesson-area"></div>

                <div class="course-prev-next" id="prev-next" style="display:none;">
                    <button class="course-prev" type="button" id="btn-prev">◀ Anterior</button>
                    <button class="course-next" type="button" id="btn-next">Próximo ▶</button>
                </div>
            </article>
        </div>
    </main>
</div>
<script type="module" src="../js/course.js"></script>
</body>
</html>
