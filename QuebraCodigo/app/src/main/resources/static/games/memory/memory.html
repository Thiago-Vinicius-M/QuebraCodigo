<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Memória – Quebra Código</title>
    <link rel="stylesheet" href="../css/global.css"/>
    <link rel="stylesheet" href="memory.css">
</head>
<body class="game-page">
<div class="game-shell">

    <header class="game-header">
        <a href="/index.html" class="go-back" id="go-back" aria-label="Voltar">
            <img src="../img/topbar/setaVoltar.png" alt="Botão retornar para a Home">
        </a>

        <h1 class="game-title">Jogo da Memória</h1>

        <div class="controls">
            <div class="ctrl-group">
                <button id="mStart">Iniciar</button>
                <button id="mReset">Resetar</button>
            </div>

            <label class="ctrl-label">
                <span class="muted">Tamanho:</span>
                <select id="mSize">
                    <option value="4x4">4 × 4</option>
                    <option value="5x4">5 × 4</option>
                    <option value="6x4">6 × 4</option>
                </select>
            </label>

            <div class="controls">
                <span class="muted">Movimentos: <strong id="mMoves">0</strong></span>
                <span class="muted">Tempo: <strong id="mTime">00:00</strong></span>
            </div>

        </div>
    </header>

    <main class="game-content">
        <div class="memory-wrap">
            <div id="mGrid" class="memory-grid cols-4"></div>
            <div id="win-overlay" class="win-overlay hidden">
                <div class="win-box">
                    <h2>Parabéns!</h2>
                    <p>Você concluiu o desafio da memória!</p>
                    <button id="play-again">Jogar novamente</button>
                </div>
            </div>
        </div>
    </main>

</div>
<script src="memory.js"></script>
</body>
</html>
