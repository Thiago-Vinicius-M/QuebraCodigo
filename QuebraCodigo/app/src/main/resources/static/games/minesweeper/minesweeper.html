<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - Quebra Código</title>
    <!-- Link para o CSS externo -->
    <link rel="stylesheet" href="minesweeper.css">
</head>
<body>
<!-- Container principal que centraliza todo o jogo -->
<div class="container">

    <!-- CABEÇALHO: Logo + Status do jogo -->
    <div class="header">
        <h1>💣 Minesweeper</h1>

        <!-- Painéis de informação -->
        <div class="info-panels">
            <!-- Contador de minas restantes -->
            <div class="info-panel">
                <div class="info-label">Minas</div>
                <div class="info-value" id="mineCounter">10</div>
            </div>

            <!-- Timer -->
            <div class="info-panel">
                <div class="info-label">Tempo</div>
                <div class="info-value" id="timer">0</div>
            </div>
        </div>
    </div>

    <!-- SELETOR DE DIFICULDADE -->
    <div class="difficulty-selector">
        <button class="difficulty-btn active" data-difficulty="easy">Fácil (8x8)</button>
        <button class="difficulty-btn" data-difficulty="medium">Médio (14x14)</button>
        <button class="difficulty-btn" data-difficulty="hard">Difícil (20x20)</button>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
        <button class="btn" id="restartBtn">🔄 Reiniciar</button>
        <button class="btn" id="hintBtn">💡 Dica</button>
    </div>

    <!-- CONTAINER DO JOGO -->
    <div class="game-container">
        <!-- Grid do campo minado (gerado dinamicamente pelo JS) -->
        <div class="grid-container" id="gridContainer"></div>

        <!-- MENSAGEM DE GAME OVER / VITÓRIA -->
        <div class="game-message" id="gameMessage">
            <div class="message-icon" id="messageIcon">💥</div>
            <div class="message-title" id="messageTitle">Game Over!</div>
            <div class="message-text" id="messageText">Você pisou em uma mina!</div>
            <button class="btn" id="tryAgainBtn">Jogar Novamente</button>
        </div>
    </div>

    <!-- INSTRUÇÕES -->
    <div class="instructions">
        <p><strong>Clique esquerdo:</strong> Revelar célula</p>
        <p><strong>Clique direito:</strong> Marcar/desmarcar bandeira 🚩</p>
        <p><strong>Objetivo:</strong> Revelar todas as células sem minas!</p>
        <p><strong>Números:</strong> Mostram quantas minas estão ao redor</p>
    </div>
</div>

<!-- Link para o JavaScript externo -->
<script src="minesweeper.js"></script>
</body>
</html>
