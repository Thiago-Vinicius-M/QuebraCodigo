# === PostgreSQL ===
# Schema "app": evita erro de permissao no "public" (PostgreSQL 15+). Criar uma vez com postgres-setup.sql
spring.datasource.url=jdbc:postgresql://localhost:5432/quebra_codigo?currentSchema=app
spring.datasource.username=qc_user
spring.datasource.password=qc_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# === Flyway (migrations no schema app; dono = qc_user apos script postgres-setup.sql) ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=app

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=app
# Ajuda a ver no log se o DDL falhou (ex.: sem permissao CREATE no schema)
logging.level.org.hibernate.tool.schema=INFO

logging.level.org.springframework.boot.autoconfigure=DEBUG

# Porta
server.port=8150

# === Configuracao de recursos estaticos ===
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
