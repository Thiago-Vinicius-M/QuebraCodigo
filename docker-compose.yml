# App Spring Boot + banco Supabase (nuvem).
# Credenciais em .env (copie de .env.example).
#
# Subir:  docker compose up --build
# Parar:  docker compose down
#
# Postgres local (opcional): docker compose -f docker-compose.yml -f docker-compose.local-db.yml up --build

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      # Usa a rede do host no build para o Maven alcançar o Central (evita "Network is unreachable")
      network: host
    container_name: quebracodigo-app
    # Mesma rede do host: evita timeout SSL com o pooler Supabase em alguns ambientes Docker
    network_mode: host
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "60000"
    restart: unless-stopped
