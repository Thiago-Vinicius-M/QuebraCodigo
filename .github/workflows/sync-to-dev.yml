name: Sync main to dev

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Attempt fast-forward merge main into dev
        id: ff
        continue-on-error: true
        run: |
          git fetch origin dev:dev
          git checkout dev
          git merge --ff-only origin/main
          git push origin dev

      - name: Open sync PR on conflict
        if: steps.ff.outcome == 'failure'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          branch: chore/sync-main-to-dev
          title: "chore: sync main to dev"
          body: |
            Automated sync from `main` to `dev` after release.

            Fast-forward failed due to conflicts — resolve manually and merge.
          commit-message: "chore: sync main to dev"
