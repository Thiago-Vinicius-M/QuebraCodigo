name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore, test and image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            app/pom.xml

      - name: Show toolchain
        run: java -version && mvn -v

      - name: Restore Maven dependencies
        run: mvn -f app/pom.xml -B -DskipTests dependency:resolve

      - name: Test (JUnit + Testcontainers)
        run: mvn -f app/pom.xml -B verify

      - name: Build Docker image
        run: docker build -t quebracodigo:${{ github.sha }} .
